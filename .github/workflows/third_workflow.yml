name: Third workflow
run-name: Third workflow
on: 
  workflow_dispatch:
jobs:
  tag-image:
    runs-on: ubuntu-latest
    steps:
      - id: commit
        uses: prompt/actions-commit-hash@v3
      - name: "Get commit's short SHA string"
        env:    
          SHORT: ${{ steps.commit.outputs.short }}
        run: echo "$SHORT"
      - name: "Get commit's long SHA string"
        env:    
          LONG: ${{ steps.commit.outputs.long }}
        run: echo "$LONG"
      - name: "Get commit's HASH SHA string"
        env:    
          HASH: ${{ steps.commit.outputs.hash }}
        run: echo "$HASH"
